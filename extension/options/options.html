<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimai Jira Search — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Kimai Jira Search</h1>
        <p>Paste your Kimai API token for this browser session.</p>
      </header>

      <form id="settings-form">
        <label for="apiToken">API token</label>
        <input
          id="apiToken"
          type="password"
          placeholder="Paste your Kimai API token"
          autocomplete="off"
          required
        />
        <p class="hint">
          Create a token in Kimai under your user menu → API access.
          Token page:
          <a href="https://kimai.k8s.private.aidb/en/profile/api-token" target="_blank" rel="noreferrer noopener">
            https://kimai.k8s.private.aidb/en/profile/api-token
          </a>
        </p>

        <div class="actions">
          <button type="button" id="test-btn" class="secondary">Test connection</button>
          <button type="submit" id="save-btn" disabled>Save token</button>
        </div>
        <p class="hint">First click Test connection. Token is saved only for current browser session.</p>
      </form>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="options.js" type="module"></script>
  </body>
</html>
