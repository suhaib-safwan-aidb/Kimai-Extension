<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimai Jira Search</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <h1>Kimai Search</h1>
        <a href="#" id="options-link" title="Settings">Settings</a>
      </header>

      <section id="setup-prompt" class="setup-prompt hidden">
        <p>Configure session API token in settings to get started.</p>
        <button id="open-options-btn" type="button">Open settings</button>
      </section>

      <section id="running-task" class="running-task hidden">
        <div class="running-header">
          <h2>Currently Running</h2>
        </div>
        <div class="running-info">
          <div class="running-title" id="running-title"></div>
          <div class="running-timer" id="running-timer">00:00:00</div>
        </div>
        <button id="stop-btn" type="button" class="stop-btn">Stop Task</button>
      </section>

      <section id="main-content" class="hidden">
        <div class="project-wrap">
          <label for="project-select" class="project-label">Project</label>
          <select id="project-select" class="project-select">
            <option value="">Loading projects...</option>
          </select>
        </div>

        <div class="search-wrap">
          <input
            id="search-input"
            type="search"
            placeholder="Search tasks inside selected project..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div id="status" class="status" aria-live="polite"></div>
        <ul id="results" class="results" role="listbox"></ul>
      </section>

      <div id="toast" class="toast hidden" aria-live="polite"></div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
